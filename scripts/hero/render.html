<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home hero render</title>
<!--
  Renders the home page hero image from the designer's holder dimensions
  (15 slots, 19 mm holes, copper) with a transparent background.
  Regenerate public/images/home-holder.png with scripts/hero/render.sh.
  Camera: "A2" from the angle review, front tier facing left, seen from the right.
-->
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1040" height="780" style="width:1040px;height:780px"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.158.0/three.min.js"></script>
<script>
(function () {
  // Holder configuration, mirroring ModelCalculator in src/GridPreview.jsx
  // for row_*_hole_diameter = 19, bottle height 120, 5 holes per row.
  const HOLE = 19;
  const HOLES_PER_ROW = 5;
  const ROWS = 3;
  const MIN_INNER_GAP = 2.75;
  const EDGE_GAP_SCALE = 1.32;
  const WIDTH = Math.ceil(MIN_INNER_GAP * (HOLES_PER_ROW - 1) + 2 * MIN_INNER_GAP * EDGE_GAP_SCALE + HOLES_PER_ROW * HOLE); // 114
  const DEPTH = Math.ceil(3 * (8 + HOLE)); // 81
  const ROW_DEPTH = DEPTH / ROWS;
  const HOLE_DEPTH = 21;                 // getHoleHeight for 80 < bottle height <= 130
  const TIER_H = [24, 19, 19];           // tier 1, tier 2, tier 3 extrusions
  const CHAMFER = 5;
  const avgGap = (WIDTH - HOLES_PER_ROW * HOLE) / (HOLES_PER_ROW + 1);
  const padLR = avgGap * EDGE_GAP_SCALE;
  const innerGap = (WIDTH - padLR * 2 - HOLES_PER_ROW * HOLE) / (HOLES_PER_ROW - 1);

  // Bottle: ScentSplit 9ml, 18 mm across, 92 mm tall.
  const BOTTLE_R = 9, BOTTLE_H = 92;

  const COLORS = [
    ["copper", "#b87333"], ["gunmetal", "#4b4f55"], ["silver", "#b9bcc2"], ["rose-gold", "#d9a08a"],
    ["blue", "#3a6fb0"], ["red", "#a83a3a"], ["yellow", "#e0b83a"], ["grey", "#8a8f96"],
    ["white", "#eceae4"], ["black", "#1a1a1a"],
  ];

  function holeCenters() {
    const out = [];
    for (let r = 0; r < ROWS; r++) {
      const z = DEPTH / 2 - (r * ROW_DEPTH + ROW_DEPTH / 2); // row 0 at the front (+z)
      for (let i = 0; i < HOLES_PER_ROW; i++) {
        const x = -WIDTH / 2 + padLR + HOLE / 2 + i * (HOLE + innerGap);
        out.push({ row: r, x, z });
      }
    }
    return out;
  }

  // Rounded rectangle in shape space (x, y) where y maps to world -z after the
  // -90deg X rotation applied to every slab.
  function roundedRect(x0, y0, x1, y1, r) {
    const s = new THREE.Shape();
    s.moveTo(x0 + r, y0);
    s.lineTo(x1 - r, y0); s.absarc(x1 - r, y0 + r, r, -Math.PI / 2, 0, false);
    s.lineTo(x1, y1 - r); s.absarc(x1 - r, y1 - r, r, 0, Math.PI / 2, false);
    s.lineTo(x0 + r, y1); s.absarc(x0 + r, y1 - r, r, Math.PI / 2, Math.PI, false);
    s.lineTo(x0, y0 + r); s.absarc(x0 + r, y0 + r, r, Math.PI, Math.PI * 1.5, false);
    return s;
  }

  // One slab: footprint from world z = zFront (front edge) back to zBack, height h,
  // starting at world y = y0, with optional circular holes through it.
  function slab(zFront, zBack, y0, h, holes) {
    const shape = roundedRect(-WIDTH / 2, -zFront, WIDTH / 2, -zBack, CHAMFER);
    for (const c of holes) {
      const p = new THREE.Path();
      p.absarc(c.x, -c.z, HOLE / 2, 0, Math.PI * 2, true);
      shape.holes.push(p);
    }
    const geo = new THREE.ExtrudeGeometry(shape, { depth: h, bevelEnabled: false, curveSegments: 24 });
    geo.rotateX(-Math.PI / 2);
    geo.translate(0, y0, 0);
    return geo;
  }

  function holderGeometry() {
    const centers = holeCenters();
    const parts = [];
    let y = 0;
    for (let t = 0; t < ROWS; t++) {
      const zFront = DEPTH / 2 - t * ROW_DEPTH;
      const zBack = -DEPTH / 2;
      const h = TIER_H[t];
      const rowHoles = centers.filter((c) => c.row === t);
      const holeSlab = Math.min(HOLE_DEPTH, h);
      if (h > holeSlab) parts.push(slab(zFront, zBack, y, h - holeSlab, []));       // solid floor under the holes
      parts.push(slab(zFront, zBack, y + (h - holeSlab), holeSlab, rowHoles));      // top slab with holes
      y += h;
    }
    return { parts, height: y, centers };
  }

  function tierTopY(row) {
    let y = 0;
    for (let t = 0; t <= row; t++) y += TIER_H[t];
    return y;
  }

  function bottleMesh(flat) {
    const g = new THREE.Group();
    const glass = flat
      ? new THREE.MeshLambertMaterial({ color: 0x2e3440 })
      : new THREE.MeshPhysicalMaterial({ color: 0x1e2530, roughness: 0.3, metalness: 0.05, clearcoat: 0.8, clearcoatRoughness: 0.2 });
    const label = flat
      ? new THREE.MeshLambertMaterial({ color: 0xe8e4dc })
      : new THREE.MeshStandardMaterial({ color: 0xe8e4dc, roughness: 0.8 });
    const cap = flat ? new THREE.MeshLambertMaterial({ color: 0x15181c }) : new THREE.MeshStandardMaterial({ color: 0x15181c, roughness: 0.4, metalness: 0.3 });
    const body = new THREE.Mesh(new THREE.CylinderGeometry(BOTTLE_R, BOTTLE_R, BOTTLE_H, 32), glass);
    body.position.y = BOTTLE_H / 2;
    const band = new THREE.Mesh(new THREE.CylinderGeometry(BOTTLE_R + 0.15, BOTTLE_R + 0.15, 34, 32), label);
    band.position.y = BOTTLE_H * 0.42;
    const top = new THREE.Mesh(new THREE.CylinderGeometry(BOTTLE_R * 0.8, BOTTLE_R * 0.8, 12, 32), cap);
    top.position.y = BOTTLE_H + 6;
    const nozzle = new THREE.Mesh(new THREE.CylinderGeometry(3, 3, 5, 16), cap);
    nozzle.position.y = BOTTLE_H + 14;
    [body, band, top, nozzle].forEach((m) => { m.castShadow = true; g.add(m); });
    return g;
  }

  function buildScene(opts) {
    const scene = new THREE.Scene();
    const { parts, centers } = holderGeometry();
    const holderMat = opts.flat
      ? new THREE.MeshLambertMaterial({ color: opts.color })
      : new THREE.MeshStandardMaterial({ color: opts.color, roughness: 0.42, metalness: 0.35 });
    const holder = new THREE.Group();
    for (const geo of parts) {
      const m = new THREE.Mesh(geo, holderMat);
      m.castShadow = !opts.flat; m.receiveShadow = !opts.flat;
      holder.add(m);
      if (opts.flat) {
        const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo, 28), new THREE.LineBasicMaterial({ color: 0x2a2a2a }));
        holder.add(edges);
      }
    }
    const rig = new THREE.Group();
    rig.add(holder);
    if (opts.bottles) {
      for (const c of centers) {
        const b = bottleMesh(opts.flat);
        b.position.set(c.x, tierTopY(c.row) - HOLE_DEPTH + 0.5, c.z);
        rig.add(b);
      }
    }
    scene.add(rig);

    if (!opts.flat) {
      const ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), new THREE.ShadowMaterial({ opacity: 0.12 }));
      ground.rotation.x = -Math.PI / 2;
      ground.position.y = -0.01;
      ground.receiveShadow = true;
      scene.add(ground);
      const key = new THREE.DirectionalLight(0xffffff, 2.2);
      key.position.set(90, 320, 130);
      key.castShadow = true;
      key.shadow.mapSize.set(2048, 2048);
      key.shadow.camera.left = -160; key.shadow.camera.right = 160;
      key.shadow.camera.top = 160; key.shadow.camera.bottom = -160;
      key.shadow.camera.near = 10; key.shadow.camera.far = 800;
      key.shadow.radius = 4;
      scene.add(key);
      const fill = new THREE.DirectionalLight(0xdfe8ff, 0.7);
      fill.position.set(-200, 120, -80);
      scene.add(fill);
      scene.add(new THREE.HemisphereLight(0xffffff, 0x9a9488, 0.9));
    } else {
      scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbbb, 1.6));
      const d = new THREE.DirectionalLight(0xffffff, 1.2);
      d.position.set(100, 200, 150);
      scene.add(d);
    }
    return { scene, rig, holderMat };
  }


  const canvas = document.getElementById("c");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(window.devicePixelRatio || 1);
  renderer.setSize(1040, 780, false);
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
  const { scene } = buildScene({ color: "#b87333", bottles: false, flat: false });
  const camera = new THREE.PerspectiveCamera(28, 1040 / 780, 1, 2000);
  const yaw = 0.62, elev = 0.55, dist = 380, lookY = 26;
  camera.position.set(Math.sin(yaw) * Math.cos(elev) * dist, lookY + Math.sin(elev) * dist, Math.cos(yaw) * Math.cos(elev) * dist);
  camera.lookAt(0, lookY, 0);
  renderer.render(scene, camera);
  document.title = "rendered";
})();
</script>
</body>
</html>
